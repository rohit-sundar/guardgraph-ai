[pytest]
# Only tests/ holds tests. Without this, a bare `pytest` from the repo root also
# walks scripts/, where standalone harnesses are named test_*.py and match
# pytest's default discovery pattern — pytest then IMPORTS them during
# collection, and any module-level side effect in one silently applies to every
# test in the process. That is not hypothetical: scripts/test_rag_pipeline.py
# replaced app.graph.ontology.get_technique_context at import time and broke an
# unrelated cache-hit test, while `pytest tests/` stayed green. Pinning testpaths
# makes both invocations mean the same thing, so a green run is green for
# everyone regardless of how they invoked it.
testpaths = tests
